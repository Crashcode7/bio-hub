<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- ==================== HEADER PROFILE ==================== -->
        <header class="profile">
            <!-- EDIT HERE: Change avatar image URL or replace with your local image file (e.g., avatar.jpg) -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop" alt="Profile Picture" class="avatar-img">
            <!-- EDIT: Change your name and description here-->
            <h1>Nama Kamu</h1>
            <p>Student & Web Developer</p>
            
            <!-- Copy/Share Link Button -->
            <button id="share-btn" class="share-btn">
                <i class="fas fa-share-nodes"></i> Share Profile
            </button>
        </header>

        <!-- ==================== IMPORTANT: LIST LINK ==================== -->
        <main class="links-container">
            <!-- EDIT: Change href with your URL and change The button text -->
            <a href="https://example.com" class="link-card" target="_blank">
                <i class="fas fa-globe"></i> Website Utama     <!-- Change The button text here -->
            </a>
            <a href="https://example.com" class="link-card" target="_blank">
                <i class="fas fa-book"></i> Catatan & Catatan Belajar
            </a>
            <a href="https://github.com" class="link-card" target="_blank">
                <i class="fab fa-github"></i> Portofolio GitHub
            </a>
            <a href="https://wa.me/628123456789" class="link-card" target="_blank">
                <i class="fas fa-comments"></i> Hubungi Saya
            </a>
            <a href="https://instagram.com" class="link-card" target="_blank">
                <i class="fab fa-instagram"></i> Instagram Utama
            </a>
        </main>

        <!-- ==================== FOOTER SOSMED ==================== -->
        <footer class="social-bar">
            <!-- EDIT: Enter your social link below -->
            <a href="https://github.com" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
            <a href="https://instagram.com" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank" class="social-icon"><i class="fab fa-x-twitter"></i></a>
            <a href="mailto:emailkamu@gmail.com" class="social-icon"><i class="fas fa-envelope"></i></a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
